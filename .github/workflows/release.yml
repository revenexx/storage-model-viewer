name: Release

# Versions + publishes @revenexx/storage-model-viewer to npm via Changesets.
# On a push to main with pending changesets, the action opens/updates a
# "Version Packages" PR; once that PR is merged, it publishes.
#
# Dual-publish: the public package goes to npmjs (OIDC trusted publishing, with
# provenance) AND to GitHub Packages (npm.pkg.github.com), so internal consumers
# that route the @revenexx scope to GitHub Packages (e.g. the Cockpit) can
# install it too.
#
# npmjs publish auth is npm OIDC *trusted publishing* — NO stored token:
#   - npmjs must have a trusted publisher configured for the package
#     (repo: revenexx/storage-model-viewer, workflow: release.yml).
#     https://docs.npmjs.com/trusted-publishers
#   - needs id-token: write + npm CLI >= 11.5.1 + Node >= 22.14.0.
#   - the repo is public, so npm provenance is generated automatically.
# GitHub Packages publish uses GITHUB_TOKEN (packages: write); no provenance
# there. GITHUB_TOKEN is also used by the changesets action to open the Version PR.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # OIDC trusted publishing requires npm CLI >= 11.5.1 (newer than the one
      # bundled with Node 22). pnpm publish shells out to this npm for auth.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mirror the current version to GitHub Packages (idempotent — skips if it's
      # already there). Runs whenever main is published-ready, so it also back-
      # fills a version first released to npmjs. No provenance on GH Packages.
      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "@revenexx:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}"
          } >> .npmrc
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@revenexx/storage-model-viewer@${VERSION}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@revenexx/storage-model-viewer@${VERSION} already on GitHub Packages — skipping"
          else
            pnpm build
            npm publish --registry https://npm.pkg.github.com --no-provenance
          fi
